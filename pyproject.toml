[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "squares-sub15"
version = "0.1.0"
description = "Squares in Squares — Sub-15 Optimization Research Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
